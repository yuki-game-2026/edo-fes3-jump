const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),info=document.getElementById('info'),bar=document.getElementById('bar'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),btn=document.getElementById('jump');let W=400,H=700,scale=1;
const img=new Image();img.src=SPRITE;
function resize(){let r=canvas.getBoundingClientRect();W=r.width;H=r.height;canvas.width=Math.round(W*devicePixelRatio);canvas.height=Math.round(H*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}window.addEventListener('resize',resize);resize();
let mode=0,stage=0,roofs=[],hazards=[],x=0,y=0,vx=0,vy=0,cam=0,charging=false,charge=0,state='menu',time=0,startTime=0,reason='',last=0,runId=0;
const modes=[{name:'初級',width:132,gap:80,obs:0.25},{name:'中級',width:96,gap:112,obs:0.65},{name:'上級',width:70,gap:133,obs:0.95}];const GOAL=1150;
function show(content){panel.innerHTML=content;overlay.classList.remove('hidden')}function hide(){overlay.classList.add('hidden')}
function menu(){state='menu';show('<h1>🏮 江戸Fes3<br>屋根渡り 🐰</h1><p>長押しで力をためて、離すとジャンプ！<br>屋根から落ちても障害物に当たっても即終了💀<br>ゴールまでたどり着け！</p>'+modes.map((m,i)=>`<button class="btn" onclick="begin(${i})">${['🟢','🟡','🔴'][i]} ${m.name} に挑戦</button>`).join('')+'<p class="foot">全3コース・各コースにゴールあり</p>')}
function begin(m){mode=m;stage=0;cam=0;time=0;charging=false;charge=0;vx=0;vy=0;let cfg=modes[m],rng=()=>Math.random();roofs=[{x:0,w:175}];let pos=175;while(pos<GOAL+240){let gap=cfg.gap+(rng()-.5)*28;let width=cfg.width+(rng()-.5)*18;roofs.push({x:pos+gap,w:width});pos+=gap+width}hazards=[];for(let i=1;i<roofs.length-1;i++){if(rng()<cfg.obs){let a=roofs[i-1],b=roofs[i],mid=(a.x+a.w+b.x)/2;hazards.push({x:mid,y: (i%3===0?-112:-68),type:i%3===0?'kite':'crow',phase:rng()*6.28})}}x=55;y=0;state='ready';startTime=performance.now();hide();info.textContent=cfg.name+'｜ゴールまで '+Math.round(GOAL)+'m'}
function jumpStart(e){e.preventDefault();if(state!=='ready'||charging)return;charging=true;charge=0;btn.setPointerCapture?.(e.pointerId)}function jumpEnd(e){e.preventDefault();if(!charging)return;charging=false;if(state!=='ready')return;state='flying';let p=charge;vx=125+270*p;vy=-(285+255*p);bar.style.width='0%'}btn.addEventListener('pointerdown',jumpStart);btn.addEventListener('pointerup',jumpEnd);btn.addEventListener('pointercancel',jumpEnd);btn.addEventListener('lostpointercapture',()=>{if(charging)jumpEnd({preventDefault(){}})});
function dead(r){state='dead';reason=r;show(`<h1>💀 GAME OVER</h1><p>${r}<br>到達距離：${Math.round(x)}m</p><button class="btn" onclick="begin(${mode})">🔄 同じ難易度でもう一度</button><button class="btn" onclick="menu()">難易度選択へ</button>`)}
function clear(){state='clear';let seconds=((performance.now()-startTime)/1000).toFixed(1);let key='edoBest'+mode;let old=Number(localStorage.getItem(key)||Infinity);if(Number(seconds)<old)localStorage.setItem(key,seconds);show(`<h1>🎆 ゴール達成！🎆</h1><p>🏮 江戸Fes3 ステージクリア！<br>${modes[mode].name} タイム：${seconds}秒<br>自己ベスト：${localStorage.getItem(key)}秒</p><button class="btn" onclick="begin(${mode})">もう一度挑戦</button><button class="btn" onclick="menu()">難易度選択へ</button>`)}
function roofAt(px){return roofs.find(r=>px>=r.x+9&&px<=r.x+r.w-9)}
function update(dt){time+=dt;if(charging&&state==='ready'){charge=Math.min(1,charge+dt/1.05);bar.style.width=Math.round(charge*100)+'%'}if(state==='flying'){let oldY=y; x+=vx*dt;y+=vy*dt;vy+=850*dt;let landed=roofAt(x);if(vy>0&&oldY<0&&y>=0&&landed){y=0;vx=0;vy=0;state='ready';stage++;}else if(y>115){dead('屋根から落ちちゃった！');return}for(let h of hazards){let hx=h.x+Math.sin(time*2+h.phase)*17,hy=h.y+Math.sin(time*3+h.phase)*12;if(Math.abs(x-hx)<27&&Math.abs(y-hy)<28){dead('空中の障害物に激突！');return}}if(x>=GOAL){clear();return}}if(state==='ready'&&!roofAt(x)){dead('足場を踏み外した！')}cam+=(Math.max(0,x-W*.26)-cam)*Math.min(1,dt*4);info.textContent=modes[mode].name+'｜残り '+Math.max(0,Math.round(GOAL-x))+'m'}
function draw(){let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#0c1740');sky.addColorStop(.65,'#5b3269');sky.addColorStop(1,'#d9797d');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);let ground=H*.54;
ctx.fillStyle='#ffdf9c';ctx.beginPath();ctx.arc(W*.76,ground-185,53,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2b2855';for(let i=0;i<12;i++){let xx=(i*80-cam*.15)% (W+100);ctx.fillRect(xx,ground+15-(i%3)*22,62,H-ground);ctx.beginPath();ctx.moveTo(xx-8,ground+16-(i%3)*22);ctx.lineTo(xx+31,ground-20-(i%3)*22);ctx.lineTo(xx+70,ground+16-(i%3)*22);ctx.fill()}ctx.fillStyle='#ffbf6b';for(let i=0;i<35;i++){let xx=(i*63-cam*.12)%(W+80);ctx.fillRect(xx,ground+45+(i%5)*25,6,9)}
let roofY=ground+40;for(let r of roofs){let rx=r.x-cam;if(rx>W+40||rx+r.w< -40)continue;ctx.fillStyle='#4b3a56';ctx.fillRect(rx,roofY,r.w,H-roofY);ctx.fillStyle='#1d2949';ctx.fillRect(rx-9,roofY-9,r.w+18,17);ctx.fillStyle='#7584a1';for(let j=0;j<r.w;j+=18){ctx.beginPath();ctx.arc(rx+j,roofY-6,10,Math.PI,0);ctx.fill()}ctx.fillStyle='#edaa60';ctx.fillRect(rx+12,roofY+32,12,20);ctx.fillRect(rx+r.w-30,roofY+32,12,20)}
for(let h of hazards){let hx=h.x-cam+Math.sin(time*2+h.phase)*17,hy=roofY+h.y+Math.sin(time*3+h.phase)*12;if(hx<-30||hx>W+30)continue;ctx.font=h.type==='kite'?'35px sans-serif':'30px sans-serif';ctx.fillText(h.type==='kite'?'🪁':'🐦‍⬛',hx-17,hy)}
ctx.fillStyle='#ffe4a1';ctx.fillRect(GOAL-cam,roofY-85,5,85);ctx.font='34px sans-serif';ctx.fillText('🏁',GOAL-cam-10,roofY-90);
let sx=x-cam,sy=roofY+y-64;if(img.complete&&img.naturalWidth){ctx.drawImage(img,sx-33,sy-20,68,91)}else{ctx.font='55px sans-serif';ctx.fillText('🐰',sx-30,sy+46)}if(charging){ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';ctx.fillText('ため中 '+Math.round(charge*100)+'%',sx-30,sy-30)}
}
function frame(t){let dt=Math.min(.035,(t-last)/1000||0);last=t;if(state==='ready'||state==='flying')update(dt);draw();requestAnimationFrame(frame)}menu();requestAnimationFrame(frame);
</script></body></html>
